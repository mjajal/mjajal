<svg xmlns="http://www.w3.org/2000/svg" width="880" height="423" viewBox="0 0 880 423" fill="none" role="img" aria-label="Career timeline, from now back to 2015">
<title>Career timeline, from now back to 2015</title>
<defs><clipPath id="card"><rect width="880" height="423" rx="14"/></clipPath></defs>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif;fill:#e6edf3}
.mono{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}
.cap{font-size:11px;letter-spacing:1.6px;font-weight:600;fill:#8b949e}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

.yrs{font-size:12px;fill:#8b949e}
.place{font-size:16px;font-weight:700}
.role{font-size:13px;font-weight:400;fill:#8b949e}
.what{font-size:13px;fill:#adbac7}
.extra{font-size:12px;fill:#6e7681}
</style>
<rect x=".5" y=".5" width="879" height="422" rx="14" fill="#0d1117" stroke="#30363d"/>

<text class="cap" x="44" y="46">THE ROAD SO FAR</text>
<text class="cap" x="840" y="46" text-anchor="end" style="fill:#6e7681">NOW → THEN</text>
<path d="M176 87V363" stroke="#30363d" stroke-width="1.5"/>
<text class="mono yrs" x="152" y="92" text-anchor="end" style="fill:#e6edf3">2023 → now</text><circle cx="176" cy="87" r="5" fill="#ff3b3b"><animate attributeName="r" values="5;13" dur="1.8s" repeatCount="indefinite"/><animate attributeName="opacity" values=".55;0" dur="1.8s" repeatCount="indefinite"/></circle><circle cx="176" cy="87" r="5" fill="#ff3b3b"/><text class="place" x="202" y="92">League<tspan class="role" dx="10">Senior Data Engineer → Senior Data Engineer II</tspan></text><text class="what" x="202" y="113">GCP data platform: streaming + batch pipelines, zero-downtime migrations, AI agents + MCP</text><text class="extra" x="202" y="133">Raised the Floor for Everyone Award · Data Quality Achievement Award</text><text class="mono yrs" x="152" y="176" text-anchor="end">2022 → 2023</text><circle cx="176" cy="171" r="4.5" fill="#0d1117" stroke="#6e7681" stroke-width="1.5"/><text class="place" x="202" y="176">Innovaccer<tspan class="role" dx="10">Senior Data Engineer</tspan></text><text class="what" x="202" y="197">Multi-source FHIR pipelines and reusable integration templates on Snowflake and AWS</text><text class="mono yrs" x="152" y="240" text-anchor="end">2018 → 2022</text><circle cx="176" cy="235" r="4.5" fill="#0d1117" stroke="#6e7681" stroke-width="1.5"/><text class="place" x="202" y="240">d2i<tspan class="role" dx="10">Data Engineer → Senior Data Engineer</tspan></text><text class="what" x="202" y="261">Real-time and batch hospital data on AWS: EHR integrations, Spark, pipeline automation</text><text class="mono yrs" x="152" y="304" text-anchor="end">2017 → 2018</text><circle cx="176" cy="299" r="4.5" fill="#0d1117" stroke="#6e7681" stroke-width="1.5"/><text class="place" x="202" y="304">Stevens Institute of Technology<tspan class="role" dx="10">M.S. Computer Science</tspan></text><text class="what" x="202" y="325">Master&#x27;s Fellowship · Course Assistant for Data Structures &amp; Algorithms</text><text class="mono yrs" x="152" y="368" text-anchor="end">2015 → 2016</text><circle cx="176" cy="363" r="4.5" fill="#0d1117" stroke="#6e7681" stroke-width="1.5"/><text class="place" x="202" y="368">Infosys<tspan class="role" dx="10">Systems Engineer, Test</tspan></text><text class="what" x="202" y="389">SAP testing and test automation. Where I learned to break things on purpose.</text>

</svg>
