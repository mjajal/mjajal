<svg xmlns="http://www.w3.org/2000/svg" width="880" height="240" viewBox="0 0 880 240" fill="none" role="img" aria-label="Contributions by month, weekday and year">
<title>Contributions by month, weekday and year</title>
<defs><clipPath id="card"><rect width="880" height="240" rx="14"/></clipPath><linearGradient id="bars" gradientUnits="userSpaceOnUse" x1="0" y1="106" x2="0" y2="198"><stop class="hi" stop-color="#39d353"/><stop class="lo" offset="1" stop-color="#006d32"/></linearGradient></defs>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif;fill:#e6edf3}
.mono{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}
.cap{font-size:11px;letter-spacing:1.6px;font-weight:600;fill:#8b949e}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

.say{font-size:15px;font-weight:600}
.tick{font-size:10px;fill:#6e7681}
.val{font-size:10px;fill:#adbac7}
.bar{transform-origin:0 198px;animation:grow 5s infinite backwards}
.hi{animation:hi 30s linear infinite}.lo{animation:lo 30s linear infinite}
@keyframes hi{0.00%,16.66%{stop-color:#39d353}16.67%,33.32%{stop-color:#ffa630}33.33%,49.99%{stop-color:#ff6b6b}50.00%,66.66%{stop-color:#79c0ff}66.67%,83.32%{stop-color:#c4b5fd}83.33%,100%{stop-color:#ffe14d}}
@keyframes lo{0.00%,16.66%{stop-color:#006d32}16.67%,33.32%{stop-color:#9c4a00}33.33%,49.99%{stop-color:#9b1c1c}50.00%,66.66%{stop-color:#1158c7}66.67%,83.32%{stop-color:#5b21b6}83.33%,100%{stop-color:#8a7300}}
@keyframes grow{0%{transform:scaleY(0);animation-timing-function:cubic-bezier(.2,.8,.2,1)}16%{transform:scaleY(1)}80%{transform:scaleY(1);animation-timing-function:ease-in}86%,100%{transform:scaleY(0)}}
.halo{paint-order:stroke;stroke:#0d1117;stroke-width:4px;stroke-linejoin:round}
.trend{stroke:#e6edf3;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;animation:draw 5s infinite backwards}
.dots{fill:#e6edf3;animation:dots 5s infinite backwards}
@keyframes draw{0%,18%{stroke-dashoffset:1;opacity:1}44%,80%{stroke-dashoffset:0;opacity:1}86%,100%{stroke-dashoffset:0;opacity:0}}
@keyframes dots{0%,16%{opacity:0}22%,80%{opacity:1}86%,100%{opacity:0}}
</style>
<rect x=".5" y=".5" width="879" height="239" rx="14" fill="#0d1117" stroke="#30363d"/>

<text class="cap" x="44" y="44">BY MONTH</text>
<text class="say" x="44" y="68">October was the peak</text>
<rect class="bar" x="50" y="174.7" width="19" height="23.3" rx="3" fill="url(#bars)" opacity="0.6" style="animation-delay:0.05s"/><text class="mono tick" x="59.5" y="216" text-anchor="middle">Dec</text><rect class="bar" x="81" y="164.1" width="19" height="33.9" rx="3" fill="url(#bars)" opacity="0.6" style="animation-delay:0.08s"/><text class="mono tick" x="90.5" y="216" text-anchor="middle">Jan</text><rect class="bar" x="112" y="173.2" width="19" height="24.8" rx="3" fill="url(#bars)" opacity="0.6" style="animation-delay:0.11s"/><text class="mono tick" x="121.5" y="216" text-anchor="middle">Feb</text><rect class="bar" x="143" y="167.7" width="19" height="30.3" rx="3" fill="url(#bars)" opacity="0.6" style="animation-delay:0.14s"/><text class="mono tick" x="152.5" y="216" text-anchor="middle">Mar</text><rect class="bar" x="174" y="166.7" width="19" height="31.3" rx="3" fill="url(#bars)" opacity="0.6" style="animation-delay:0.17s"/><text class="mono tick" x="183.5" y="216" text-anchor="middle">Apr</text><rect class="bar" x="205" y="180.3" width="19" height="17.7" rx="3" fill="url(#bars)" opacity="0.6" style="animation-delay:0.20s"/><text class="mono tick" x="214.5" y="216" text-anchor="middle">May</text><rect class="bar" x="236" y="172.2" width="19" height="25.8" rx="3" fill="url(#bars)" opacity="0.6" style="animation-delay:0.23s"/><text class="mono tick" x="245.5" y="216" text-anchor="middle">Jun</text><rect class="bar" x="267" y="159.6" width="19" height="38.4" rx="3" fill="url(#bars)" opacity="0.6" style="animation-delay:0.26s"/><text class="mono tick" x="276.5" y="216" text-anchor="middle">Jul</text><rect class="bar" x="298" y="156" width="19" height="42" rx="3" fill="url(#bars)" opacity="0.6" style="animation-delay:0.29s"/><text class="mono tick" x="307.5" y="216" text-anchor="middle">Aug</text><rect class="bar" x="329" y="123.2" width="19" height="74.8" rx="3" fill="url(#bars)" opacity="0.6" style="animation-delay:0.32s"/><text class="mono tick" x="338.5" y="216" text-anchor="middle">Sep</text><rect class="bar" x="360" y="106" width="19" height="92" rx="3" fill="url(#bars)" opacity="1" style="animation-delay:0.35s"/><text class="mono tick" x="369.5" y="216" text-anchor="middle" style="fill:#e6edf3">Oct</text><rect class="bar" x="391" y="154.5" width="19" height="43.5" rx="3" fill="url(#bars)" opacity="0.6" style="animation-delay:0.38s"/><text class="mono tick" x="400.5" y="216" text-anchor="middle">Nov</text><path class="trend" pathLength="1" d="M59.5 154.7L90.5 144.1L121.5 153.2L152.5 147.7L183.5 146.7L214.5 160.3L245.5 152.2L276.5 139.6L307.5 136L338.5 103.2L369.5 86L400.5 134.5" style="animation-delay:0.15s"/><g class="dots" style="animation-delay:0.15s"><circle cx="59.5" cy="154.7" r="2.4"/><circle cx="90.5" cy="144.1" r="2.4"/><circle cx="121.5" cy="153.2" r="2.4"/><circle cx="152.5" cy="147.7" r="2.4"/><circle cx="183.5" cy="146.7" r="2.4"/><circle cx="214.5" cy="160.3" r="2.4"/><circle cx="245.5" cy="152.2" r="2.4"/><circle cx="276.5" cy="139.6" r="2.4"/><circle cx="307.5" cy="136" r="2.4"/><circle cx="338.5" cy="103.2" r="2.4"/><circle cx="369.5" cy="86" r="2.4"/><circle cx="400.5" cy="134.5" r="2.4"/></g><text class="mono val halo" x="369.5" y="100" text-anchor="middle">182</text>
<path d="M440 36V210M684 36V210" stroke="#21262d"/>
<text class="cap" x="464" y="44">BY WEEKDAY</text>
<text class="say" x="464" y="68">Mondays run hottest</text>
<rect class="bar" x="469.5" y="106" width="17" height="92" rx="3" fill="url(#bars)" opacity="1" style="animation-delay:0.20s"/><text class="mono tick" x="478" y="216" text-anchor="middle" style="fill:#e6edf3">Mon</text><rect class="bar" x="497.5" y="106.9" width="17" height="91.1" rx="3" fill="url(#bars)" opacity="0.6" style="animation-delay:0.23s"/><text class="mono tick" x="506" y="216" text-anchor="middle">Tue</text><rect class="bar" x="525.5" y="121.1" width="17" height="76.9" rx="3" fill="url(#bars)" opacity="0.6" style="animation-delay:0.26s"/><text class="mono tick" x="534" y="216" text-anchor="middle">Wed</text><rect class="bar" x="553.5" y="116.7" width="17" height="81.3" rx="3" fill="url(#bars)" opacity="0.6" style="animation-delay:0.29s"/><text class="mono tick" x="562" y="216" text-anchor="middle">Thu</text><rect class="bar" x="581.5" y="134.4" width="17" height="63.6" rx="3" fill="url(#bars)" opacity="0.6" style="animation-delay:0.32s"/><text class="mono tick" x="590" y="216" text-anchor="middle">Fri</text><rect class="bar" x="609.5" y="186.4" width="17" height="11.6" rx="3" fill="url(#bars)" opacity="0.6" style="animation-delay:0.35s"/><text class="mono tick" x="618" y="216" text-anchor="middle">Sat</text><rect class="bar" x="637.5" y="194.4" width="17" height="3.6" rx="3" fill="url(#bars)" opacity="0.6" style="animation-delay:0.38s"/><text class="mono tick" x="646" y="216" text-anchor="middle">Sun</text><path class="trend" pathLength="1" d="M646 174.4L618 166.4L590 114.4L562 96.7L534 101.1L506 86.9L478 86" style="animation-delay:0.30s"/><g class="dots" style="animation-delay:0.30s"><circle cx="646" cy="174.4" r="2.4"/><circle cx="618" cy="166.4" r="2.4"/><circle cx="590" cy="114.4" r="2.4"/><circle cx="562" cy="96.7" r="2.4"/><circle cx="534" cy="101.1" r="2.4"/><circle cx="506" cy="86.9" r="2.4"/><circle cx="478" cy="86" r="2.4"/></g><text class="mono val halo" x="478" y="100" text-anchor="middle">207</text>
<text class="cap" x="708" y="44">BY YEAR</text>
<text class="say" x="708" y="68">Busiest: 2026</text>
<rect class="bar" x="713" y="117.5" width="23" height="80.5" rx="3" fill="url(#bars)" opacity="0.6" style="animation-delay:0.35s"/><text class="mono tick" x="724.5" y="216" text-anchor="middle">2023</text><rect class="bar" x="746" y="136.6" width="23" height="61.4" rx="3" fill="url(#bars)" opacity="0.6" style="animation-delay:0.38s"/><text class="mono tick" x="757.5" y="216" text-anchor="middle">2024</text><rect class="bar" x="779" y="148.1" width="23" height="49.9" rx="3" fill="url(#bars)" opacity="0.6" style="animation-delay:0.41s"/><text class="mono tick" x="790.5" y="216" text-anchor="middle">2025</text><rect class="bar" x="812" y="106" width="23" height="92" rx="3" fill="url(#bars)" opacity="1" style="animation-delay:0.44s"/><text class="mono tick" x="823.5" y="216" text-anchor="middle" style="fill:#e6edf3">2026</text><path class="trend" pathLength="1" d="M724.5 97.5L757.5 116.6L790.5 128.1L823.5 86" style="animation-delay:0.45s"/><g class="dots" style="animation-delay:0.45s"><circle cx="724.5" cy="97.5" r="2.4"/><circle cx="757.5" cy="116.6" r="2.4"/><circle cx="790.5" cy="128.1" r="2.4"/><circle cx="823.5" cy="86" r="2.4"/></g><text class="mono val halo" x="724.5" y="111.5" text-anchor="middle">787</text><text class="mono val halo" x="757.5" y="130.6" text-anchor="middle">600</text><text class="mono val halo" x="790.5" y="142.1" text-anchor="middle">488</text><text class="mono val halo" x="823.5" y="100" text-anchor="middle">899</text>

</svg>
