<svg xmlns="http://www.w3.org/2000/svg" width="880" height="240" viewBox="0 0 880 240" fill="none" role="img" aria-label="Contributions by month, weekday and year">
<title>Contributions by month, weekday and year</title>
<defs><clipPath id="card"><rect width="880" height="240" rx="14"/></clipPath><linearGradient id="bars" gradientUnits="userSpaceOnUse" x1="0" y1="106" x2="0" y2="198"><stop stop-color="#39d353"/><stop offset="1" stop-color="#006d32"/></linearGradient></defs>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif;fill:#e6edf3}
.mono{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}
.cap{font-size:11px;letter-spacing:1.6px;font-weight:600;fill:#8b949e}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

.say{font-size:15px;font-weight:600}
.tick{font-size:10px;fill:#6e7681}
.val{font-size:10px;fill:#adbac7}
.bar{transform-origin:0 198px;animation:grow .9s cubic-bezier(.2,.8,.2,1) both}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
</style>
<rect x=".5" y=".5" width="879" height="239" rx="14" fill="#0d1117" stroke="#30363d"/>

<text class="cap" x="44" y="44">BY MONTH</text>
<text class="say" x="44" y="68">October was the peak</text>
<rect class="bar" x="50" y="174.7" width="19" height="23.3" rx="3" fill="url(#bars)" opacity="0.6" style="animation-delay:0.10s"/><text class="mono tick" x="59.5" y="216" text-anchor="middle">Dec</text><rect class="bar" x="81" y="164.1" width="19" height="33.9" rx="3" fill="url(#bars)" opacity="0.6" style="animation-delay:0.15s"/><text class="mono tick" x="90.5" y="216" text-anchor="middle">Jan</text><rect class="bar" x="112" y="173.2" width="19" height="24.8" rx="3" fill="url(#bars)" opacity="0.6" style="animation-delay:0.20s"/><text class="mono tick" x="121.5" y="216" text-anchor="middle">Feb</text><rect class="bar" x="143" y="167.7" width="19" height="30.3" rx="3" fill="url(#bars)" opacity="0.6" style="animation-delay:0.25s"/><text class="mono tick" x="152.5" y="216" text-anchor="middle">Mar</text><rect class="bar" x="174" y="166.7" width="19" height="31.3" rx="3" fill="url(#bars)" opacity="0.6" style="animation-delay:0.30s"/><text class="mono tick" x="183.5" y="216" text-anchor="middle">Apr</text><rect class="bar" x="205" y="180.3" width="19" height="17.7" rx="3" fill="url(#bars)" opacity="0.6" style="animation-delay:0.35s"/><text class="mono tick" x="214.5" y="216" text-anchor="middle">May</text><rect class="bar" x="236" y="172.2" width="19" height="25.8" rx="3" fill="url(#bars)" opacity="0.6" style="animation-delay:0.40s"/><text class="mono tick" x="245.5" y="216" text-anchor="middle">Jun</text><rect class="bar" x="267" y="159.6" width="19" height="38.4" rx="3" fill="url(#bars)" opacity="0.6" style="animation-delay:0.45s"/><text class="mono tick" x="276.5" y="216" text-anchor="middle">Jul</text><rect class="bar" x="298" y="156" width="19" height="42" rx="3" fill="url(#bars)" opacity="0.6" style="animation-delay:0.50s"/><text class="mono tick" x="307.5" y="216" text-anchor="middle">Aug</text><rect class="bar" x="329" y="123.2" width="19" height="74.8" rx="3" fill="url(#bars)" opacity="0.6" style="animation-delay:0.55s"/><text class="mono tick" x="338.5" y="216" text-anchor="middle">Sep</text><rect class="bar" x="360" y="106" width="19" height="92" rx="3" fill="url(#bars)" opacity="1" style="animation-delay:0.60s"/><text class="mono tick" x="369.5" y="216" text-anchor="middle" style="fill:#e6edf3">Oct</text><text class="mono val" x="369.5" y="100" text-anchor="middle">182</text><rect class="bar" x="391" y="180.3" width="19" height="17.7" rx="3" fill="url(#bars)" opacity="0.6" style="animation-delay:0.65s"/><text class="mono tick" x="400.5" y="216" text-anchor="middle">Nov</text>
<path d="M440 36V210M684 36V210" stroke="#21262d"/>
<text class="cap" x="464" y="44">BY WEEKDAY</text>
<text class="say" x="464" y="68">Mondays run hottest</text>
<rect class="bar" x="469.5" y="106" width="17" height="92" rx="3" fill="url(#bars)" opacity="1" style="animation-delay:0.40s"/><text class="mono tick" x="478" y="216" text-anchor="middle" style="fill:#e6edf3">Mon</text><text class="mono val" x="478" y="100" text-anchor="middle">208</text><rect class="bar" x="497.5" y="112.6" width="17" height="85.4" rx="3" fill="url(#bars)" opacity="0.6" style="animation-delay:0.45s"/><text class="mono tick" x="506" y="216" text-anchor="middle">Tue</text><rect class="bar" x="525.5" y="120.2" width="17" height="77.8" rx="3" fill="url(#bars)" opacity="0.6" style="animation-delay:0.50s"/><text class="mono tick" x="534" y="216" text-anchor="middle">Wed</text><rect class="bar" x="553.5" y="117.1" width="17" height="80.9" rx="3" fill="url(#bars)" opacity="0.6" style="animation-delay:0.55s"/><text class="mono tick" x="562" y="216" text-anchor="middle">Thu</text><rect class="bar" x="581.5" y="137" width="17" height="61" rx="3" fill="url(#bars)" opacity="0.6" style="animation-delay:0.60s"/><text class="mono tick" x="590" y="216" text-anchor="middle">Fri</text><rect class="bar" x="609.5" y="189.2" width="17" height="8.8" rx="3" fill="url(#bars)" opacity="0.6" style="animation-delay:0.65s"/><text class="mono tick" x="618" y="216" text-anchor="middle">Sat</text><rect class="bar" x="637.5" y="195.3" width="17" height="2.7" rx="3" fill="url(#bars)" opacity="0.6" style="animation-delay:0.70s"/><text class="mono tick" x="646" y="216" text-anchor="middle">Sun</text>
<text class="cap" x="708" y="44">BY YEAR</text>
<text class="say" x="708" y="68">Busiest: 2026</text>
<rect class="bar" x="713" y="112.6" width="23" height="85.4" rx="3" fill="url(#bars)" opacity="0.6" style="animation-delay:0.70s"/><text class="mono tick" x="724.5" y="216" text-anchor="middle">2023</text><text class="mono val" x="724.5" y="106.6" text-anchor="middle">787</text><rect class="bar" x="746" y="132.9" width="23" height="65.1" rx="3" fill="url(#bars)" opacity="0.6" style="animation-delay:0.75s"/><text class="mono tick" x="757.5" y="216" text-anchor="middle">2024</text><text class="mono val" x="757.5" y="126.9" text-anchor="middle">600</text><rect class="bar" x="779" y="145.1" width="23" height="52.9" rx="3" fill="url(#bars)" opacity="0.6" style="animation-delay:0.80s"/><text class="mono tick" x="790.5" y="216" text-anchor="middle">2025</text><text class="mono val" x="790.5" y="139.1" text-anchor="middle">488</text><rect class="bar" x="812" y="106" width="23" height="92" rx="3" fill="url(#bars)" opacity="1" style="animation-delay:0.85s"/><text class="mono tick" x="823.5" y="216" text-anchor="middle" style="fill:#e6edf3">2026</text><text class="mono val" x="823.5" y="100" text-anchor="middle">848</text>

</svg>
